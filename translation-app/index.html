<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eng-Ch Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="text-box-container">
            <label for="input-text">English (Input)</label>
            <textarea id="input-text" placeholder="Enter English text here..."></textarea>
        </div>

        <div class="controls">
            <button id="translate-btn">Eng→TC</button>
            <button id="reverse-btn">Eng←TC</button>
        </div>

        <div class="text-box-container">
            <label for="output-text">Chinese (Output)</label>
            <textarea id="output-text" readonly placeholder="Translation will appear here..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
